name: Build video 2 (DDR Alltag)

on:
  push:
    paths:
      - "content/video2/**"
      - "scripts/**"
      - ".github/workflows/build-video2.yml"
  workflow_dispatch:
    inputs:
      smoke:
        description: "Smoke test: 960x540, scenes 1,2,5,8 only"
        type: boolean
        default: false
      force_narration:
        description: "Re-render narration (costs one TTS request per model)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      cache_key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Script hash (cache key)
        id: key
        run: echo "key=tts-v2-${{ hashFiles('content/video2/plan.json') }}" >> $GITHUB_OUTPUT

      - name: Restore narration
        id: cache
        uses: actions/cache@v4
        with:
          path: build/video2/audio
          key: ${{ steps.key.outputs.key }}

      - name: Check quota before spending anything
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_narration == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_quota.py

      - name: Narrate once (one request)
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_narration == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.force_narration }}" = "true" ]; then
            python scripts/narrate_once.py --force
          else
            python scripts/narrate_once.py
          fi

      - name: Transcribe and cut at the act markers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/recheck_narration.py

      - name: Upload narration for the render jobs
        uses: actions/upload-artifact@v4
        with:
          name: narration-v2
          path: build/video2/audio/*.wav
          retention-days: 3

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-v2
          path: build/video2/manifest.json
          retention-days: 3

  render:
    needs: narration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        act: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Download narration + manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest-v2
          path: build/video2
      - uses: actions/download-artifact@v4
        with:
          name: narration-v2
          path: build/video2/audio

      - name: Fetch licensed photos
        run: python scripts/fetch_photos.py

      - name: Render act ${{ matrix.act }}
        env:
          OUT_WIDTH: ${{ inputs.smoke == true && '960' || '2560' }}
        run: python scripts/render_graphics.py "$OUT_WIDTH" --act ${{ matrix.act }} --acts 3

      - name: Upload segments
        uses: actions/upload-artifact@v4
        with:
          name: segments-act-${{ matrix.act }}
          path: build/video2/segments/*.mp4
          retention-days: 3
          if-no-files-found: error

  assemble:
    needs: [narration, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download manifest + narration
        uses: actions/download-artifact@v4
        with:
          name: manifest-v2
          path: build/video2
      - uses: actions/download-artifact@v4
        with:
          name: narration-v2
          path: build/video2/audio

      - name: Download all segments
        uses: actions/download-artifact@v4
        with:
          pattern: segments-act-*
          path: build/segments
          merge-multiple: true

      - name: Collect segments
        run: |
          mkdir -p build/video2/segments
          cp -v build/segments/*.mp4 build/video2/segments/
          ls -1 build/video2/segments | wc -l

      - name: Assemble final MP4
        run: python scripts/assemble.py

      - name: YouTube package
        run: python scripts/youtube_meta.py

      - name: Report
        run: |
          echo "### Video 2" >> $GITHUB_STEP_SUMMARY
          cat build/video2/render_report.json >> $GITHUB_STEP_SUMMARY

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: video2-ddr-alltag
          path: |
            content/video2/out/*.mp4
            content/video2/out/*.txt
            build/video2/render_report.json
            build/video2/manifest.json
            build/video2/credits.json
          retention-days: 30
          if-no-files-found: error
