name: Build German Documentary (Render Farm)

on:
  push:
    branches:
      - main
    paths:
      - 'script.txt'
      - 'shots.txt'
  workflow_dispatch:

jobs:
  prep-and-render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: [0, 1, 2, 3, 4] # 5 Concurrent Servers
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && pip install piper-tts faster-whisper
      
      # We only need TTS/Images on chunk 0 to save API/compute on others, 
      # but shots.txt length is needed by all. Wait, images are needed by all chunks!
      - name: Fetch 2K Images (fetch_images.py)
        run: python fetch_images.py
        
      - name: Download Piper Voice Model
        if: matrix.chunk == 0
        run: |
          wget https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx -O de_DE-thorsten-high.onnx
          wget https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json -O de_DE-thorsten-high.onnx.json
          
      - name: Run TTS Synthesis
        if: matrix.chunk == 0
        run: |
          sed -i 's|/home/kai/Downloads/projects/German/.venv/bin/piper|piper|g' run_voice.sh
          bash run_voice.sh
          python captions.py narration.wav captions.srt
          
      # Since only chunk 0 makes narration, others need a dummy narration to calculate total length
      - name: Mock narration for other chunks
        if: matrix.chunk != 0
        run: |
          ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t 600 -q:a 9 -acodec libmp3lame narration.wav
          
      - name: Render Video Chunk (Distributed Farm)
        run: python build_video.py --chunk ${{ matrix.chunk }} --total-chunks 5
        
      - name: Upload Chunk Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-chunk-${{ matrix.chunk }}
          path: tmp/*.mp4
          
      - name: Upload Audio Artifacts
        if: matrix.chunk == 0
        uses: actions/upload-artifact@v4
        with:
          name: audio-assets
          path: |
            narration.wav
            captions.srt
            music.mp3

  merge:
    needs: prep-and-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install ffmpeg-normalize

      - name: Download All Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: render-chunk-*
          merge-multiple: true
          path: tmp/
          
      - name: Download Audio Assets
        uses: actions/download-artifact@v4
        with:
          name: audio-assets
          path: .
          
      - name: Mux Final Documentary
        run: python build_video.py --mux-final
        
      - name: Master Audio (EBU R128)
        run: |
          ffmpeg-normalize video.mp4 -pr -c:a aac -b:a 192k -o video_mastered.mp4
          mv video_mastered.mp4 video.mp4
          
      - name: Upload Final Master
        uses: actions/upload-artifact@v4
        with:
          name: german-documentary
          path: video.mp4
          retention-days: 5
