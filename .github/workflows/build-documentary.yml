name: Build German Documentary

on:
  push:
    branches:
      - main
    paths:
      - 'script.txt'
      - 'shots.txt'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFMPEG)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts faster-whisper

      - name: Download Piper Voice Model
        run: |
          wget https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx -O de_DE-thorsten-high.onnx
          wget https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json -O de_DE-thorsten-high.onnx.json

      - name: Run TTS Synthesis (run_voice.sh)
        run: |
          # Patch run_voice.sh to use the global piper command since we installed it via pip
          sed -i 's|/home/kai/Downloads/projects/German/.venv/bin/piper|piper|g' run_voice.sh
          bash run_voice.sh

      - name: Generate Captions (captions.py)
        run: |
          python captions.py narration.wav captions.srt

      - name: Fetch 2K Images (fetch_images.py)
        run: |
          python fetch_images.py

      - name: Render Final Video (build_video.py)
        run: |
          python build_video.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: german-documentary
          path: |
            video.mp4
            credits.txt
          retention-days: 5
